name: Deploy mirror to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-integrity.txt

      - name: Install integrity-check dependencies
        run: python -m pip install --requirement requirements-integrity.txt

      - name: Build project-path-safe mirror
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner_name="${GITHUB_REPOSITORY%%/*}"
          if [[ "$repo_name" == "${owner_name}.github.io" ]]; then
            base_path=""
          else
            base_path="/$repo_name"
          fi
          python build_github_pages.py \
            --source actionbutton-site \
            --destination _site \
            --base-path "$base_path"

      - name: Validate deployed JavaScript syntax
        shell: bash
        run: find _site -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify archive integrity
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner_name="${GITHUB_REPOSITORY%%/*}"
          if [[ "$repo_name" == "${owner_name}.github.io" ]]; then
            base_path=""
          else
            base_path="/$repo_name"
          fi
          python verify_integrity.py --root _site --base-path "$base_path"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
