<body class="login">
<div id="login"><h1><a href="http://wordpress.org/" title="Powered by WordPress">action button dot net</a></h1>
<form action="#" id="loginform" method="post" name="loginform" onsubmit="return false">
<p>
<label>Username<br/>
<input class="input" id="user_login" name="log" size="20" tabindex="10" type="text" value=""/></label>
</p>
<p>
<label>Password<br/>
<input class="input" id="user_pass" name="pwd" size="20" tabindex="20" type="password" value=""/></label>
</p>
<p class="forgetmenot"><label><input id="rememberme" name="rememberme" tabindex="90" type="checkbox" value="forever"/> Remember Me</label></p>
<p class="submit">
<input class="button-primary" id="wp-submit" name="wp-submit" tabindex="100" type="submit" value="Log In"/>
<input name="redirect_to" type="hidden" value="http://www.actionbutton.net/?p=636"/>
<input name="testcookie" type="hidden" value="1"/>
</p>
</form>
<p id="nav">
<a href="#">Register</a> |
<a href="#" title="Password Lost and Found">Lost your password?</a>
</p>
</div>
<p id="backtoblog"><a href="/" title="Are you lost?">&larr; Back to action button dot net</a></p>
<script type="text/javascript">
function wp_attempt_focus(){
setTimeout( function(){ try{
d = document.getElementById('user_login');
d.focus();
d.select();
} catch(e){}
}, 200);
}

wp_attempt_focus();
if(typeof wpOnload=='function')wpOnload();
</script>
</body>
