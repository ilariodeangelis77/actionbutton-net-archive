<body class="login login-action-login wp-core-ui locale-en-us">
<div id="login">
<h1><a href="https://wordpress.org/" tabindex="-1" title="Powered by WordPress">action button dot net</a></h1>
<form action="#" id="loginform" method="post" name="loginform" onsubmit="return false">
<p>
<label for="user_login">Username<br/>
<input class="input" id="user_login" name="log" size="20" type="text" value=""/></label>
</p>
<p>
<label for="user_pass">Password<br/>
<input class="input" id="user_pass" name="pwd" size="20" type="password" value=""/></label>
</p>
<p class="forgetmenot"><label for="rememberme"><input id="rememberme" name="rememberme" type="checkbox" value="forever"/> Remember Me</label></p>
<p class="submit">
<input class="button button-primary button-large" id="wp-submit" name="wp-submit" type="submit" value="Log In"/>
<input name="redirect_to" type="hidden" value="http://www.actionbutton.net/wp/wp-admin/"/>
<input name="testcookie" type="hidden" value="1"/>
</p>
</form>
<p id="nav">
<a href="#">Register</a> | 	<a href="#" title="Password Lost and Found"></a>
</p>
<script type="text/javascript">
function wp_attempt_focus(){
setTimeout( function(){ try{
d = document.getElementById('user_login');
d.focus();
d.select();
} catch(e){}
}, 200);
}

wp_attempt_focus();
if(typeof wpOnload=='function')wpOnload();
</script>
<p id="backtoblog"><a href="/" title="Are you lost">&larr; Back to action button dot net</a></p>
</div>
